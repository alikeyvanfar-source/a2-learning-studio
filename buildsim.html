<!-- a2-kit:css v1.0.3 -->
<style id="a2-kit-css">
/* ==========================================================================
   A² Kit · v1.0.3 · shared design language for A² Learning Studio platforms
   A² Learning Studio · Dr. Ali Keyvanfar & Dr. Arezou Shafaghat · KSU
   Canonical source: a2-learning-studio/kit/a2-kit.css (inlined into each
   platform between <!-- a2-kit:css --> markers by kit/sync.py).

   Principles: editorial and calm; Fraunces for display, Inter for UI,
   JetBrains Mono for data; warm paper surfaces; one accent per platform
   (--a2-accent), studio burgundy as the brand mark; soft depth; every text
   token >= 4.5:1 on every surface token; 24px+ targets (44px on touch);
   visible focus; reduced motion honored.

   Base element rules use :where() so they carry zero specificity and never
   override a platform's own CSS.
   ========================================================================== */

:root {
  /* type */
  --a2-font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --a2-font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --a2-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --a2-t-2xs: 0.75rem;   /* 12px, meta only (uppercase eyebrow) */
  --a2-t-xs: 0.8125rem;  /* 13px */
  --a2-t-sm: 0.875rem;   /* 14px */
  --a2-t-md: 1rem;       /* 16px body */
  --a2-t-lg: 1.125rem;   /* 18px */
  --a2-t-xl: 1.375rem;   /* 22px */
  --a2-t-2xl: 1.75rem;   /* 28px */
  --a2-t-3xl: 2.25rem;   /* 36px */
  --a2-t-4xl: clamp(2.25rem, 1.4rem + 3.2vw, 3.5rem);
  --a2-lh-tight: 1.15;
  --a2-lh: 1.55;

  /* surfaces (warm paper) */
  --a2-bg: #f6f2ea;
  --a2-surface: #fffdf8;
  --a2-surface-2: #f0eadf;
  --a2-surface-3: #e8e0d2;
  --a2-line: #e2d9c9;
  --a2-line-strong: #c9bea9;

  /* ink: all >= 4.5:1 on --a2-bg, --a2-surface and --a2-surface-2 */
  --a2-ink: #1c1a17;
  --a2-ink-2: #46413a;
  --a2-ink-3: #635c52;

  /* brand + accent (each platform overrides --a2-accent / --a2-accent-strong) */
  --a2-brand: #7a1c1c;
  --a2-accent: #7a1c1c;
  --a2-accent-strong: #5e1414;
  --a2-accent-ink: #ffffff;
  --a2-accent-soft: color-mix(in srgb, var(--a2-accent) 9%, var(--a2-surface));
  --a2-accent-line: color-mix(in srgb, var(--a2-accent) 32%, var(--a2-line));

  /* status (text-safe on light surfaces) */
  --a2-ok: #1d6b45;     --a2-ok-soft: #e5f2ea;
  --a2-warn: #8a5300;   --a2-warn-soft: #fbefd9;
  --a2-err: #a8231a;    --a2-err-soft: #fbe6e3;
  --a2-info: #1f4f9c;   --a2-info-soft: #e5edf9;

  /* spacing (4px base) */
  --a2-s1: 4px; --a2-s2: 8px; --a2-s3: 12px; --a2-s4: 16px;
  --a2-s5: 24px; --a2-s6: 32px; --a2-s7: 48px; --a2-s8: 64px;

  /* shape + depth */
  --a2-r-sm: 6px; --a2-r: 10px; --a2-r-lg: 16px; --a2-r-pill: 999px;
  --a2-shadow-1: 0 1px 2px rgba(28, 26, 23, .06), 0 1px 1px rgba(28, 26, 23, .04);
  --a2-shadow-2: 0 10px 24px -12px rgba(28, 26, 23, .22), 0 2px 6px rgba(28, 26, 23, .06);
  --a2-shadow-3: 0 24px 60px -20px rgba(28, 26, 23, .34), 0 4px 12px rgba(28, 26, 23, .08);

  /* motion */
  --a2-ease: cubic-bezier(.2, .7, .2, 1);
  --a2-dur: 180ms;

  /* layout */
  --a2-max: 1120px;
  --a2-bar-h: 56px;
  --a2-target: 44px;
  --a2-focus-ring: 0 0 0 2px var(--a2-surface), 0 0 0 4px var(--a2-accent);

  color-scheme: light;
}

/* ---------- base (zero specificity) ---------- */
:where(html.a2) { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--a2-bar-h) + 12px); }
:where(body.a2) {
  margin: 0;
  background: var(--a2-bg);
  color: var(--a2-ink);
  font: 400 var(--a2-t-md)/var(--a2-lh) var(--a2-font-ui);
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
:where(body.a2) :where(h1, h2, h3) {
  font-family: var(--a2-font-display);
  font-weight: 500;
  line-height: var(--a2-lh-tight);
  letter-spacing: -0.01em;
  color: var(--a2-ink);
  font-optical-sizing: auto;
}
:where(body.a2) :where(h4, h5, h6) { font-family: var(--a2-font-ui); font-weight: 600; line-height: 1.3; }
:where(body.a2) :where(a) { color: var(--a2-accent); text-underline-offset: .18em; text-decoration-thickness: 1px; }
:where(body.a2) :where(a:hover) { color: var(--a2-accent-strong); }
:where(body.a2) :where(code, kbd, samp, pre, .a2-num) { font-family: var(--a2-font-mono); font-variant-numeric: tabular-nums; }
:where(body.a2) :where(button, input, select, textarea) { font: inherit; color: inherit; }
:where(body.a2) :where(img, svg, video, canvas) { max-width: 100%; }
:where(body.a2) ::selection { background: color-mix(in srgb, var(--a2-accent) 22%, transparent); }

/* one visible focus style everywhere (keyboard only) */
:where(body.a2) :focus { outline: none; }
:where(body.a2) :focus-visible {
  outline: 2px solid var(--a2-accent);
  outline-offset: 2px;
  border-radius: var(--a2-r-sm);
}
:where(body.a2) :where(input, select, textarea):focus-visible { outline-offset: 0; }

/* ---------- utilities ---------- */
.a2-sr, .a2-visually-hidden {
  position: absolute !important; width: 1px !important; height: 1px !important;
  padding: 0 !important; margin: -1px !important; overflow: hidden !important;
  clip: rect(0 0 0 0) !important; white-space: nowrap !important; border: 0 !important;
}
.a2-skip {
  position: fixed; left: var(--a2-s3); top: -100px; z-index: 10000;
  background: var(--a2-ink); color: #fff; padding: 10px 16px; border-radius: var(--a2-r);
  font: 600 var(--a2-t-sm)/1 var(--a2-font-ui); text-decoration: none;
  transition: top var(--a2-dur) var(--a2-ease);
}
.a2-skip:focus { top: var(--a2-s3); color: #fff; }
.a2-container { width: min(100% - 2 * var(--a2-s4), var(--a2-max)); margin-inline: auto; }
.a2-stack > * + * { margin-top: var(--a2-stack, var(--a2-s4)); }
.a2-row { display: flex; gap: var(--a2-s3); align-items: center; flex-wrap: wrap; }
.a2-grow { flex: 1 1 auto; }
.a2-mono { font-family: var(--a2-font-mono); font-variant-numeric: tabular-nums; }
.a2-eyebrow {
  font: 600 var(--a2-t-2xs)/1.2 var(--a2-font-ui); letter-spacing: .12em; text-transform: uppercase;
  color: var(--a2-ink-3);
}
.a2-eyebrow.is-accent { color: var(--a2-accent); }
.a2-lede { font-size: var(--a2-t-lg); color: var(--a2-ink-2); max-width: 62ch; }
.a2-muted { color: var(--a2-ink-3); }
.a2-display { font-family: var(--a2-font-display); font-weight: 500; letter-spacing: -0.015em; line-height: var(--a2-lh-tight); }
.a2-hr { border: 0; border-top: 1px solid var(--a2-line); margin: var(--a2-s5) 0; }

/* ---------- icons ---------- */
.a2-ico { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.a2-ico.is-fill { fill: currentColor; stroke: none; }

/* ---------- buttons ---------- */
.a2-btn {
  --_bg: var(--a2-surface); --_fg: var(--a2-ink); --_bd: var(--a2-line-strong);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--a2-s2);
  min-height: var(--a2-target); padding: 0 var(--a2-s4);
  border: 1px solid var(--_bd); border-radius: var(--a2-r);
  background: var(--_bg); color: var(--_fg);
  font: 600 var(--a2-t-sm)/1.1 var(--a2-font-ui); letter-spacing: .005em;
  text-decoration: none; cursor: pointer; user-select: none; white-space: nowrap;
  box-shadow: var(--a2-shadow-1);
  transition: background var(--a2-dur) var(--a2-ease), border-color var(--a2-dur) var(--a2-ease),
              box-shadow var(--a2-dur) var(--a2-ease), transform var(--a2-dur) var(--a2-ease);
}
.a2-btn:hover { --_bd: var(--a2-ink-3); color: var(--_fg); }
.a2-btn:active { transform: translateY(1px); }
.a2-btn[disabled], .a2-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; box-shadow: none; transform: none; }
.a2-btn.is-primary { --_bg: var(--a2-accent); --_fg: var(--a2-accent-ink); --_bd: var(--a2-accent); }
.a2-btn.is-primary:hover { --_bg: var(--a2-accent-strong); --_bd: var(--a2-accent-strong); }
.a2-btn.is-quiet { --_bg: transparent; --_bd: transparent; box-shadow: none; }
.a2-btn.is-quiet:hover { --_bg: var(--a2-surface-2); }
.a2-btn.is-danger { --_fg: var(--a2-err); --_bd: color-mix(in srgb, var(--a2-err) 45%, var(--a2-line)); }
.a2-btn.is-sm { min-height: 36px; padding: 0 var(--a2-s3); font-size: var(--a2-t-xs); }
.a2-btn.is-lg { min-height: 52px; padding: 0 var(--a2-s5); font-size: var(--a2-t-md); border-radius: var(--a2-r-lg); }
.a2-btn.is-icon { width: var(--a2-target); padding: 0; }
.a2-btn.is-block { width: 100%; }
.a2-btn.a2-btn:focus-visible { outline: none; box-shadow: var(--a2-focus-ring); }
@media (pointer: fine) { .a2-btn.is-sm { min-height: 32px; } }

/* ---------- surfaces ---------- */
.a2-card {
  background: var(--a2-surface); border: 1px solid var(--a2-line); border-radius: var(--a2-r-lg);
  box-shadow: var(--a2-shadow-1); padding: var(--a2-s5);
}
.a2-card.is-raised { box-shadow: var(--a2-shadow-2); }
.a2-card.is-accent { border-top: 3px solid var(--a2-accent); }
.a2-card.is-interactive { transition: box-shadow var(--a2-dur) var(--a2-ease), border-color var(--a2-dur) var(--a2-ease), transform var(--a2-dur) var(--a2-ease); }
.a2-card.is-interactive:hover { box-shadow: var(--a2-shadow-2); border-color: var(--a2-line-strong); transform: translateY(-1px); }
.a2-panel { background: var(--a2-surface-2); border-radius: var(--a2-r); padding: var(--a2-s4); }

/* ---------- chips, badges, tags ---------- */
.a2-chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px;
  border-radius: var(--a2-r-pill); border: 1px solid var(--a2-line); background: var(--a2-surface);
  font: 500 var(--a2-t-xs)/1 var(--a2-font-ui); color: var(--a2-ink-2);
}
.a2-chip.is-accent { background: var(--a2-accent-soft); border-color: var(--a2-accent-line); color: var(--a2-accent-strong); }
button.a2-chip { cursor: pointer; min-height: 36px; }
button.a2-chip[aria-pressed="true"] { background: var(--a2-accent); border-color: var(--a2-accent); color: var(--a2-accent-ink); }
.a2-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: var(--a2-r-pill);
  font: 600 var(--a2-t-2xs)/1.1 var(--a2-font-ui); letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid transparent; vertical-align: middle;
}
.a2-badge.is-required { background: var(--a2-err-soft); color: var(--a2-err); border-color: color-mix(in srgb, var(--a2-err) 25%, transparent); }
.a2-badge.is-optional { background: var(--a2-surface-2); color: var(--a2-ink-2); border-color: var(--a2-line); }
.a2-badge.is-done { background: var(--a2-ok-soft); color: var(--a2-ok); }
.a2-badge.is-locked { background: var(--a2-surface-2); color: var(--a2-ink-3); }
.a2-badge.is-new, .a2-badge.is-accent { background: var(--a2-accent-soft); color: var(--a2-accent-strong); border-color: var(--a2-accent-line); }

/* ---------- callouts (guidance) ---------- */
.a2-callout {
  display: grid; grid-template-columns: auto 1fr; gap: var(--a2-s3); align-items: start;
  padding: var(--a2-s4); border-radius: var(--a2-r); border: 1px solid var(--a2-line);
  background: var(--a2-surface); color: var(--a2-ink-2);
}
.a2-callout > .a2-ico { margin-top: 2px; color: var(--a2-accent); }
.a2-callout strong { color: var(--a2-ink); }
.a2-callout.is-next { background: var(--a2-accent-soft); border-color: var(--a2-accent-line); }
.a2-callout.is-info { background: var(--a2-info-soft); border-color: color-mix(in srgb, var(--a2-info) 25%, transparent); }
.a2-callout.is-info > .a2-ico { color: var(--a2-info); }
.a2-callout.is-warn { background: var(--a2-warn-soft); border-color: color-mix(in srgb, var(--a2-warn) 25%, transparent); }
.a2-callout.is-warn > .a2-ico { color: var(--a2-warn); }
.a2-callout.is-ok { background: var(--a2-ok-soft); border-color: color-mix(in srgb, var(--a2-ok) 25%, transparent); }
.a2-callout.is-ok > .a2-ico { color: var(--a2-ok); }

/* ---------- forms ---------- */
.a2-field { display: grid; gap: 6px; }
.a2-field > label, .a2-label { font: 600 var(--a2-t-sm)/1.3 var(--a2-font-ui); color: var(--a2-ink); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.a2-hint { font-size: var(--a2-t-xs); color: var(--a2-ink-3); }
.a2-error { font-size: var(--a2-t-xs); color: var(--a2-err); font-weight: 600; }
.a2-input, .a2-select, .a2-textarea {
  width: 100%; min-height: var(--a2-target); box-sizing: border-box; padding: 10px 12px;
  border: 1px solid var(--a2-line-strong); border-radius: var(--a2-r); background: var(--a2-surface);
  color: var(--a2-ink); font: 400 var(--a2-t-md)/1.4 var(--a2-font-ui);
  transition: border-color var(--a2-dur) var(--a2-ease), box-shadow var(--a2-dur) var(--a2-ease);
}
.a2-textarea { min-height: 96px; resize: vertical; }
.a2-input::placeholder, .a2-textarea::placeholder { color: var(--a2-ink-3); }
.a2-input:focus-visible, .a2-select:focus-visible, .a2-textarea:focus-visible { outline: none; border-color: var(--a2-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--a2-accent) 22%, transparent); }
.a2-input[aria-invalid="true"] { border-color: var(--a2-err); }
.a2-scale { display: flex; gap: var(--a2-s2); flex-wrap: wrap; }
.a2-scale label {
  position: relative; display: inline-grid; place-items: center; min-width: var(--a2-target); min-height: var(--a2-target);
  padding: 0 10px; border: 1px solid var(--a2-line-strong); border-radius: var(--a2-r); background: var(--a2-surface);
  font: 600 var(--a2-t-sm)/1 var(--a2-font-ui); cursor: pointer;
}
.a2-scale input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.a2-scale label:has(input:checked) { background: var(--a2-accent); border-color: var(--a2-accent); color: var(--a2-accent-ink); }
.a2-scale label:has(input:focus-visible) { box-shadow: var(--a2-focus-ring); }
.a2-scale-ends { display: flex; justify-content: space-between; font-size: var(--a2-t-xs); color: var(--a2-ink-3); max-width: 340px; }

/* ---------- progress + stepper ---------- */
.a2-progress { height: 6px; border-radius: var(--a2-r-pill); background: var(--a2-surface-3); overflow: hidden; }
.a2-progress > span { display: block; height: 100%; width: var(--a2-pct, 0%); background: var(--a2-accent); border-radius: inherit; transition: width .4s var(--a2-ease); }
.a2-stepper { position: relative; list-style: none; margin: 0; padding: 0; display: flex; gap: var(--a2-s2); overflow-x: auto; scrollbar-width: thin; }
.a2-stepper > li { flex: none; position: relative; }
.a2-step {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 6px;
  border-radius: var(--a2-r-pill); border: 1px solid var(--a2-line); background: var(--a2-surface);
  font: 500 var(--a2-t-xs)/1.1 var(--a2-font-ui); color: var(--a2-ink-2); text-decoration: none; cursor: pointer; white-space: nowrap;
}
.a2-step .a2-step-n {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--a2-surface-2); color: var(--a2-ink-2); font: 600 12px/1 var(--a2-font-mono);
}
.a2-step[aria-current="step"] { border-color: var(--a2-accent); color: var(--a2-ink); background: var(--a2-accent-soft); }
.a2-step[aria-current="step"] .a2-step-n { background: var(--a2-accent); color: var(--a2-accent-ink); }
.a2-step.is-done .a2-step-n { background: var(--a2-ok); color: #fff; }
.a2-step.is-locked, .a2-step[aria-disabled="true"] { color: var(--a2-ink-3); cursor: not-allowed; background: var(--a2-surface-2); }
.a2-step:focus-visible { outline: none; box-shadow: var(--a2-focus-ring); }

/* ---------- suite bar (shared top bar) ---------- */
.a2-bar {
  position: sticky; top: 0; z-index: 900; min-height: var(--a2-bar-h);
  display: flex; align-items: center; gap: var(--a2-s3); padding: 6px var(--a2-s4);
  background: color-mix(in srgb, var(--a2-surface) 96%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--a2-line);
  font-family: var(--a2-font-ui);
}
.a2-bar-brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--a2-ink); text-decoration: none; }
.a2-mark {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px;
  background: var(--a2-brand); color: #fff; font: 600 16px/1 var(--a2-font-display); letter-spacing: -.02em;
}
.a2-bar-title { display: grid; min-width: 0; line-height: 1.15; }
.a2-bar-title b { font: 600 15px/1.2 var(--a2-font-display); color: var(--a2-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a2-bar-title small { font-size: var(--a2-t-2xs); color: var(--a2-ink-3); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a2-bar-where { margin-left: var(--a2-s2); padding-left: var(--a2-s3); border-left: 1px solid var(--a2-line); font-size: var(--a2-t-sm); color: var(--a2-ink-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a2-bar-where:empty { display: none; }
.a2-bar-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.a2-bar-actions .a2-btn { min-height: 40px; }
.a2-bar-actions .a2-btn .a2-btn-label { display: inline; }
.a2-bar .a2-more { display: none; }
@media (max-width: 720px) {
  .a2-bar-where { display: none; }
  .a2-bar .a2-hide-sm { display: none; }
  .a2-bar .a2-more { display: inline-flex; }
  .a2-bar-actions .a2-btn .a2-btn-label { display: none; }
  .a2-bar-actions .a2-btn { width: 44px; min-height: 44px; padding: 0; }
}
@media (max-width: 380px) { .a2-bar-title small { display: none; } }
.a2-menu { display: grid; gap: var(--a2-s2); }
.a2-menu .a2-btn { justify-content: flex-start; width: 100%; min-height: 52px; font-size: var(--a2-t-md); }
.a2-menu .a2-btn .a2-state { margin-left: auto; font-weight: 500; color: var(--a2-ink-3); font-size: var(--a2-t-sm); }

/* where-am-I strip under the bar (mobile shows location here) */

  /* Module 1: blueprint site canvas */
  .bp { background: var(--bp-bg); color: var(--bp-ink); border-radius: var(--a2-r-lg); padding: 12px; box-shadow: var(--a2-shadow-2); }

  .m1-cell.z-road { background: linear-gradient(transparent calc(50% - 1px), rgba(255, 236, 200, .75) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)) 0 0 / 50% 100% repeat-x, #6e5333; }
  .m1-cell.z-overhead { background: linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(120, 214, 255, .95) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)), rgba(120, 214, 255, .12); }

  .m1-cell[draggable="true"] { cursor: grab; }
  .m1-flow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .bp-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: var(--a2-t-xs); color: var(--bp-ink-2); justify-content: center; }
  .bp-foot span { display: inline-flex; gap: 6px; align-items: center; }
  .bp-foot i { display: inline-block; width: 16px; height: 0; border-top: 2px dashed currentColor; }
  .sw-setback { background: repeating-linear-gradient(45deg, rgba(244, 170, 92, .75) 0 2px, transparent 2px 6px), var(--bp-bg) !important; }
  .sw-blocked { background: repeating-linear-gradient(45deg, rgba(255, 128, 128, .9) 0 2px, transparent 2px 5px), repeating-linear-gradient(-45deg, rgba(255, 128, 128, .9) 0 2px, transparent 2px 5px), var(--bp-bg) !important; }
  .sw-road { background: linear-gradient(transparent 9px, rgba(255, 236, 200, .8) 9px 11px, transparent 11px), #6e5333 !important; }
  .sw-overhead { background: linear-gradient(90deg, transparent 8px, rgba(120, 214, 255, 1) 8px 11px, transparent 11px), var(--bp-bg) !important; }

  @media (max-width: 380px) { .bp { padding: 8px; } }

  /* Module 2: crew schedule grid */
  .m2-grid { border: 1px solid var(--a2-line-strong); border-radius: var(--a2-r-lg); overflow: hidden; background: var(--a2-surface); }

  .m2-cell { position: relative; min-height: 64px; padding: 6px 5px; border-left: 1px solid var(--a2-line); display: flex; flex-direction: column; gap: 4px; cursor: pointer; background: var(--a2-surface); min-width: 0; }

  .m2-chip.is-ok { border-color: color-mix(in srgb, var(--a2-ok) 55%, transparent); background: var(--a2-ok-soft); }

  .m2-pool { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }

  .m2-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

  /* reports and tables */

  /* Module 3: CPM */

  .m3-ticks span { position: absolute; transform: translateX(-50%); font-family: var(--a2-font-mono); font-size: 12px; }
  .m3-rows { border-top: 1px solid var(--a2-line); }
  .m3-row { padding: 10px 0; border-bottom: 1px solid var(--a2-line); }
  .m3-name b { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--a2-t-sm); }
  .m3-name small { display: block; font-size: var(--a2-t-xs); color: var(--a2-ink-3); margin-top: 2px; }

  .m3-crit-flag { font: 600 12px/1 var(--a2-font-ui); color: var(--a2-accent-strong); background: var(--a2-accent-soft); border: 1px solid var(--a2-accent-line); border-radius: 999px; padding: 3px 7px; }
  .m3-path { margin: var(--a2-s3) 0 0; font-size: var(--a2-t-sm); color: var(--a2-ink-2); }
  .m3-path b { color: var(--a2-ink); }
  .m3-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--a2-t-xs); color: var(--a2-ink-2); margin-top: var(--a2-s3); }
  .m3-legend span { display: inline-flex; gap: 6px; align-items: center; }

  @media (max-width: 900px) {

  }
  @media (max-width: 520px) { .m3-row { grid-template-columns: 1fr; } .m3-ctl { justify-content: start; } }

  /* Module 4: coordination board */
  .m4-board { border: 1px solid var(--a2-line-strong); border-radius: var(--a2-r-lg); overflow: hidden; background: var(--a2-surface); }

  .m4-hrow { border-top: 0; background: var(--a2-surface-2); }

  function ensureSkip() {

  /* ------------------------------------------------------------------ init */

      log.start();
      if (cfg.autolog) autolog();
      if (cfg.onReady) try { cfg.onReady(A2); } catch (e) { console.error(e); }
    });
    return A2;
  };
})();

function askCertName() {

    '<input id="cert-name-in" class="a2-input" type="text" maxlength="60" autocomplete="off" spellcheck="false" aria-describedby="cert-name-hint">' +

function calcM1Score(placed, fixed, items) {
  const CONSTRAINT = M1.CONSTRAINT;
  const gate  = fixed.find(f => f.id === 'gate');
  const gate2 = fixed.find(f => f.id === 'gate2');
  const crane = fixed.find(f => f.id === 'crane');

  const getPos = (id) => {
    const it = items.find(i => i.id === id);
    if (!it) { const f = fixed.find(f => f.id === id); return f ? [f.col, f.row] : null; }
    return placed[id] ? [placed[id][1], placed[id][0]] : null;
  };
  const eucDist = (a, b) => {
    if (!a || !b) return 12;
    return Math.sqrt(Math.pow(a[0]-b[0],2) + Math.pow(a[1]-b[1],2));
  };
  const toFt = d => Math.round(d * 15);

  const gatePos  = [gate.col,  gate.row];
  const gate2Pos = [gate2.col, gate2.row];
  const cranePos = [crane.col, crane.row];

  // Weighted travel distances (frequency × distance)
  let totalDist = 0;
  totalDist += eucDist(gatePos,  getPos('office'))    * 4;
  totalDist += eucDist(gatePos,  getPos('welfare'))   * 6;
  totalDist += eucDist(gatePos,  getPos('firstaid'))  * 2;
  totalDist += eucDist(gate2Pos, getPos('parking'))   * 8;
  totalDist += eucDist(cranePos, getPos('materials1'))* 10;
  totalDist += eucDist(cranePos, getPos('materials2'))* 10;
  totalDist += eucDist(cranePos, getPos('storage'))   * 6;
  totalDist += eucDist(gate2Pos, getPos('fueling'))   * 5;

  const distFt = toFt(totalDist);

  /* ── CONSTRAINT VIOLATIONS ─────────────────────────────── */
  const violationMsgs = [];
  let penaltyPts = 0;

  items.forEach(it => {
    if (!placed[it.id]) return;
    const [row, col] = placed[it.id];
    const ct = CONSTRAINT[row][col];
    if (ct === 'blocked' || ct === 'setback' || ct === 'road') {
      violationMsgs.push(`${it.label} on the ${ct === 'road' ? 'haul road' : ct + ' zone'} (-15)`);
      penaltyPts += 15;
    }
    if (ct === 'overhead' && (it.id === 'fueling' || it.id === 'storage')) {
      violationMsgs.push(`${it.label} under the overhead power line (-8)`);
      penaltyPts += 8;
    }
  });

  // Fuel ≥ 2 cells from welfare
  const fuelPos    = getPos('fueling');
  const welfarePos = getPos('welfare');
  if (fuelPos && welfarePos && eucDist(fuelPos, welfarePos) < 2) {
    violationMsgs.push('Fuel Station closer than 2 cells to the Welfare Block (-10)');
    penaltyPts += 10;
  }

  // Material staging ≤ 3 cells from crane
  ['materials1','materials2'].forEach(id => {
    const p = getPos(id);
    if (p && eucDist(cranePos, p) > 3) {
      violationMsgs.push(`Material Staging ${id==='materials1'?'A':'B'} more than 3 cells from the crane (-8)`);
      penaltyPts += 8;
    }
  });

  // Office and welfare within 4 cells of main gate
  ['office','welfare'].forEach(id => {
    const p = getPos(id);
    if (p && eucDist(gatePos, p) > 4) {
      violationMsgs.push(`${items.find(i=>i.id===id).label} more than 4 cells from the Main Gate (-5)`);
      penaltyPts += 5;
    }
  });

  const violations = violationMsgs.length;

  /* ── CALIBRATED SCORING ─────────────────────────────────────
     Anchors computed by simulation on this exact 12×12 grid:
       BEST_DIST  ≈  64  (optimal placement, no violations)
       WORST_DIST ≈ 360  (everything in worst corners)
     Formula: rawFlow = 100 × (WORST - actual) / (WORST - BEST)
     This gives ~100% for perfect layout, ~0% for worst layout,
     and every intermediate placement lands on a fair curve.
  ─────────────────────────────────────────────────────────── */
  const BEST_DIST  = 60;
  const WORST_DIST = 344;
  const span = WORST_DIST - BEST_DIST;                          // 296
  const rawFlow = Math.round(100 * (WORST_DIST - totalDist) / span);
  const flow = Math.max(0, Math.min(100, rawFlow - penaltyPts));

  return { dist: distFt, flow, violations, violationMsgs };
}

      { text: 'Pre-planned cold weather protocol: tenting, heat, admixtures ready', points: 35, budget: -2000, schedule: 0 },
      { text: 'Stop pour, cover slab, reschedule balance for next day', points: 20, budget: 3000, schedule: 0.5 },
      { text: 'Continue pour unprotected — hope for the best', points: 0, budget: 25000, schedule: 2 },
    ]
  },
  { // Day 4
    title: 'Day 4: Change Order',
    context: 'Client approved +500SF flooring change. Affects MEP layout and framing.',
    question: 'How do you manage the change order impact?',
    options: [
      { text: 'Immediate RFI + updated drawings + affected subcontractor notification + cost log', points: 35, budget: 0, schedule: 0 },
      { text: 'Verbal OK from PM, continue work, update drawings later', points: 15, budget: 8000, schedule: 1 },
      { text: 'Ignore and proceed with original plan', points: 0, budget: 30000, schedule: 3 },
    ]
  },
  { // Day 5
    title: 'Day 5: Labor Shortage Crisis',
    context: '3 key ironworkers called out sick. Steel delivery arrives today. Critical lift planned.',
    question: 'How do you maintain productivity?',
    options: [
      { text: 'Activate pre-arranged sub list + rebalance tasks + reschedule non-critical lift', points: 35, budget: -1000, schedule: 0 },
      { text: 'Hire emergency labor through agency (premium rate)', points: 15, budget: 9000, schedule: 0 },
      { text: 'Attempt lift with reduced crew — safety risk', points: 0, budget: 20000, schedule: -1, quality: -20 },
    ]
  },
];
var M6_BEST = (function () {
  const bestPractices = [
    'Structured morning briefings reduce daily coordination waste by 45 minutes per crew.',
    'Proactive redeployment eliminates idle time — key superintendents always have Plan B ready.',
    'Pre-planned weather protocols are 10x cheaper than reactive storm responses.',
    'Documenting changes immediately protects against disputes and rework costs.',
    'Maintaining a qualified sub/temp list is a mark of experienced site management.'
  ];
  return bestPractices;
})();
BUILD[6] = function (host) {
  M6 = { day: 1, maxDays: 5, base: 0, bonus: 0, decisions: 0, budget: 250000, schedule: 0, quality: 100, streak: 0, locked: false };
  onModCleanup(function () { M6 = null; });
  host.innerHTML = '<div id="m6-area"></div>';
  m6Render();
};
function m6Render() {
  if (!M6) return;
  var day = M6.day, sc = m6DayScenarios[day - 1], ev = M6_EVENTS.filter(function (e) { return e.day === day; })[0];
  var possible = (day - 1) * 35;
  $('m6-area').innerHTML =
    '<section class="a2-card" aria-labelledby="m6-tl" style="margin-bottom:16px"><div class="bs-title-row" style="justify-content:space-between"><h2 class="bs-panel-h" id="m6-tl" style="margin:0">Project timeline</h2><span class="a2-eyebrow">Day ' + day + ' of ' + M6.maxDays + '</span></div>' +
    '<div class="bs-days" aria-hidden="true">' + Array.from({ length: M6.maxDays }, function (_, i) { return '<span class="' + (i < day - 1 ? 'done' : i === day - 1 ? 'now' : '') + '"></span>'; }).join('') + '</div>' +
    '<div class="a2-kpis bs-kpis" style="margin-bottom:0">' + kpi('points so far', M6.base + (possible ? ' / ' + possible : '')) + kpi('budget', money(M6.budget), M6.budget <= 250000) + kpi('schedule', weeks(M6.schedule), M6.schedule <= 0) + kpi('quality', M6.quality + '%', M6.quality >= 90 ? true : M6.quality >= 75 ? 'warn' : false) + '</div>' +
    (M6.streak >= 2 ? '<p class="bs-note" style="margin-top:12px">' + I('star') + '<span><b>' + M6.streak + '-decision streak.</b> Streak bonus so far: +' + M6.bonus + ' points, shown for recognition and not added to your module score.</span></p>' : '') + '</section>' +
    (ev ? '<div class="a2-callout is-warn" style="margin-bottom:16px">' + I('alert') + '<div><strong>Site event · ' + esc(ev.title) + ':</strong> ' + esc(ev.text) + '</div></div>' : '') +
    '<section class="a2-card bs-decision" aria-labelledby="m6-q"><span class="a2-eyebrow is-accent">Today\'s decision · Required</span>' +
    '<h2 id="m6-q" tabindex="-1">' + esc(sc.title) + '</h2><p class="ctx">' + esc(sc.context) + '</p><p style="margin:0 0 12px"><b>' + esc(sc.question) + '</b></p>' +
    '<ul class="bs-options">' + sc.options.map(function (o, i) { return '<li><button type="button" class="bs-opt" data-opt="' + i + '" aria-pressed="false">' + esc(o.text) + '</button></li>'; }).join('') + '</ul></section>';
  document.querySelectorAll('#m6-area [data-opt]').forEach(function (b) { b.addEventListener('click', function () { m6Choose(+b.dataset.opt); }); });
  M6.locked = false;
  setLive(M6.decisions ? Math.round(M6.base / (M6.decisions * 35) * 100) : null);
}
function m6Choose(i) {
  if (!M6 || M6.locked) return;
  M6.locked = true;
  var dayIndex = M6.day - 1, sc = m6DayScenarios[dayIndex], opt = sc.options[i];
  document.querySelectorAll('#m6-area [data-opt]').forEach(function (b) { b.disabled = true; if (+b.dataset.opt === i) b.setAttribute('aria-pressed', 'true'); });
  M6.streak = opt.points >= 30 ? M6.streak + 1 : 0;
  var streakBonus = M6.streak >= 2 ? Math.round(opt.points * 0.05 * M6.streak) : 0;
  M6.base += opt.points; M6.bonus += streakBonus;
  M6.budget += opt.budget; M6.schedule += opt.schedule || 0;
  if (opt.quality) M6.quality = Math.max(0, M6.quality + opt.quality);
  M6.decisions++;
  setDirty();
  A2.log.event('decision', { target: 'm6:day' + (dayIndex + 1), value: String(i), score: opt.points, correct: opt.points >= 30 });
  setLive(Math.round(M6.base / (M6.decisions * 35) * 100));
  var good = opt.points >= 30, last = M6.day >= M6.maxDays;
  feedbackDialog({
    title: (good ? 'Excellent call' : opt.points >= 15 ? 'Acceptable' : 'Costly mistake') + '\u00a0· Day\u00a0' + (dayIndex + 1), lead: sc.title,
    msg: good ? 'Smart superintendent decision.' + (streakBonus ? ' Streak bonus: +' + streakBonus + ' points (recognition only, not added to your module score).' : '')
      : opt.points >= 15 ? 'A reasonable choice, but the top option would have cost less and saved time.'
      : 'This reactive decision cost your project ' + money(opt.budget) + ' in avoidable costs.',
    kpis: [['points earned', opt.points + ' / 35', good], ['budget', (opt.budget <= 0 ? 'Saved ' : 'Lost ') + money(opt.budget), opt.budget <= 0], ['schedule', weeks(opt.schedule || 0), (opt.schedule || 0) <= 0], ['choice', good ? 'Optimal' : 'Suboptimal', good]],
    tip: good ? { title: 'Best practice.', text: M6_BEST[dayIndex] } : { title: 'Lesson.', text: 'Planning ahead eliminates most on-site crises. Always have contingency plans ready.' },
    action: last ? 'See the five-day summary' : 'Continue to Day ' + (M6.day + 1),
    onClose: function () {
      if (!M6) return;
      M6.day++;
      if (M6.day > M6.maxDays) { m6Final(); return; }
      m6Render();
      var h = $('m6-q'); if (h) { h.focus({ preventScroll: true }); h.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); }
    }
  });
}
function m6Final() {
  var maxPossible = M6.maxDays * 35, pct = Math.min(100, Math.round(M6.base / maxPossible * 100)), saved = 250000 - M6.budget;
  completeModule(6, pct, { breakdown: 'base=' + M6.base + ';bonus=' + M6.bonus + ';budget=' + M6.budget + ';schedule_wk=' + M6.schedule + ';quality=' + M6.quality });
  setLive(pct);
  $('m6-area').innerHTML = '<section class="a2-card is-accent" aria-labelledby="m6-sum"><span class="a2-eyebrow">Five-day simulation complete</span><h2 id="m6-sum" tabindex="-1" style="font-size:var(--a2-t-2xl);margin:6px 0 12px">Your site week in numbers</h2>' +
    '<div class="a2-kpis bs-kpis">' + kpi('final score', pct + '%') + kpi(saved >= 0 ? 'budget saved' : 'over budget', money(saved), saved >= 0) + kpi('schedule', weeks(M6.schedule), M6.schedule <= 0) + kpi('quality', M6.quality + '%', M6.quality >= 90) + kpi('streak bonus (not scored)', '+' + M6.bonus) + '</div>' +
    '<p style="margin:0;color:var(--a2-ink-2)">' + (pct >= 85 ? 'Outstanding site management. You demonstrate gold-level superintendent skills.' : pct >= 70 ? 'Good performance. With more proactive planning, you can reach gold level.' : 'Your reactive approach cost the project significantly. Review the planning principles and retry.') + '</p></section>';
  showResults(6, pct);
}

/* ---------------------------------------------------------------- init */
A2.init({
  platform: 'buildsim', name: 'BuildSim', subtitle: 'Job site simulator', version: '2026.10',
  accent: '#b4430c', accentStrong: '#8f3409', audio: false,
  help: {
    title: 'How BuildSim works',
    intro: 'Six job-site planning modules, done in order. Each one gives rule-based instant feedback and a score, and 70% unlocks the next. No name is asked for: progress stays in this browser under an anonymous session code.',
    steps: [
      { title: 'Start on Home', text: 'Start opens Module 1 and creates an anonymous session on this device.', required: true },
      { title: 'Modules 1 to 6', text: 'Score 70% or more to unlock the next module. Replay any unlocked module to raise your best score.', required: true },
      { title: 'Certificate', text: 'Unlocks when all six modules are at 70% or more and your total reaches 80% (480 of 600 points). A name can be typed at print time; it is never saved.' },
      { title: 'Progress, Leaderboard and Report', text: 'Your scores, the best runs on this device, and a formative report for each module.', optional: true },
      { title: 'Feedback and Your data', text: 'Rate BuildSim at any time; export your anonymous activity log as JSON or CSV.', optional: true }
    ],
    keys: [['Tab / Shift+Tab', 'Move between controls'], ['Arrow keys', 'Move around the site plan, crew schedule or coordination board'], ['Enter or Space', 'Select a facility, worker or crew, then place it in the focused cell'],
      ['Delete or Backspace', 'Remove from the focused cell'], ['Esc', 'Cancel a selection, close a dialog, or leave a module']]
  },
  onReady: boot
});

function boot() {
  loadState();
  if (state.started && !state.run) {
    ensureRun();
    if (storageNote === 'migrated') upsertBoard();
    if (storageNote !== 'fallback' && storageNote !== 'nostore') saveState();
  }
  if (state.started && state.run) A2.log.event('run_resume', { target: 'run', value: 'R' + state.run.code + '-' + state.run.n + (storageNote ? ';' + storageNote : '') });
  renderSession();

  document.addEventListener('click', function (e) {
    var nav = e.target.closest('.bs-nav-btn');
    if (nav) { showScreen(nav.getAttribute('data-screen')); return; }
    var go = e.target.closest('[data-goto]');
    if (go) {
      var id = +go.getAttribute('data-goto');
      if (go.getAttribute('aria-disabled') === 'true') { announce('Module ' + id + ' is locked. Pass Module ' + (id - 1) + ' with 70% first.'); return; }
      if (mod && mod.id === id) return;
      if (current === 'module') leaveModule(function () { launchModule(id); }); else launchModule(id);
      return;
    }
    var la = e.target.closest('[data-launch]');
    if (la) { launchModule(+la.getAttribute('data-launch')); }
  });
  $('bs-back').addEventListener('click', function () { showScreen('modules'); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.defaultPrevented || openDialogs()) return;
    if (current !== 'module' || !mod) return;
    if (mod.cancelSelection && mod.cancelSelection()) { e.preventDefault(); return; }
    e.preventDefault();
    showScreen('modules');
  });
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(measureBars);
    var bar = document.querySelector('.a2-bar'); if (bar) ro.observe(bar);
    ro.observe($('bs-modbar'));
  } else window.addEventListener('resize', measureBars);
  measureBars();
  watchDialogs();
  showScreen('home', { force: true, focus: false });
}

/* Kit dialogs (including the kit's own "Your data" dialog): on short phone screens the dialog body can scroll
   while holding nothing focusable, so keyboard users could not scroll it. Make such a body a focusable,
   labelled region; undo it when the body no longer scrolls. */
function tuneDialogBody(d) {
  var b = d.querySelector('.a2-dialog-body'); if (!b) return;
  var scrolls = b.scrollHeight > b.clientHeight + 1;
  var inner = b.querySelector('a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (scrolls && !inner) {
    b.setAttribute('tabindex', '0'); b.setAttribute('role', 'region');
    var t = d.querySelector('.a2-dialog-head h2'); if (t && t.id) b.setAttribute('aria-labelledby', t.id);
  } else if (b.getAttribute('role') === 'region') {
    b.removeAttribute('tabindex'); b.removeAttribute('role'); b.removeAttribute('aria-labelledby');
  }
}
function watchDialogs() {
  if (!window.MutationObserver) return;
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      Array.prototype.forEach.call(m.addedNodes, function (n) {
        if (n.nodeType === 1 && n.matches('dialog.a2-dialog')) requestAnimationFrame(function () { tuneDialogBody(n); });
      });
    });
  }).observe(document.body, { childList: true });
  window.addEventListener('resize', function () { document.querySelectorAll('dialog.a2-dialog[open]').forEach(tuneDialogBody); });
}

/* read-only hooks for the automated walk-through and self-checks */
window.BuildSim = {
  scoringVersion: SCORING_VERSION,
  state: function () { return JSON.parse(JSON.stringify(state)); },
  storageNote: function () { return storageNote; },
  progressSig: function () { return progressSig(state); },
  calcM2Score: function (sched) { return M2 ? calcM2Score(sched) : null; },
  calcM4Score: function (at) { return M4 ? calcM4Score(at) : null; },
  m3: function () { return M3 ? { cpm: m3Cpm(), score: m3Score(), spent: m3CrashCost(), event: M3.event, lag: M3.lag } : null; },
  module: function () { return mod ? { id: mod.id, dirty: mod.dirty, evaluated: mod.evaluated } : null; },
  m6: function () { return M6 ? { day: M6.day, decisions: M6.decisions, base: M6.base, bonus: M6.bonus } : null; },
  m5: function () { return M5 ? { cur: M5.cur, points: M5.points } : null; }
};
